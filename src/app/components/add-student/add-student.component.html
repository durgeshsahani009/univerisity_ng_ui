<div class="container">
    <div class="row">
      <div class="col-md-6">
        <h3>Add Student</h3>
      </div>
      <div class="col-md-6 d-flex justify-content-end">
        <a class="btn btn-sm btn-primary" href="/student-list">Student List</a>
      </div>
    </div>

  <div class="row">
    <div class="col-md-6">
      
  <form [formGroup]="myform" (ngSubmit)="submit(myform.value)">
    <div class="form-group mb-3">
      <label>Name</label>
      <input type="text" formControlName="name" class="form-control" />
    </div>

    <div class="form-group mb-3">
      <label>Age</label>
    <input type="number" formControlName="age" class="form-control" />
    </div>

    <div class="form-group mb-3">
      <label>Program</label>
     <input type="text" formControlName="program"  class="form-control" />
    </div>

    <div class="form-group mb-3">
      <button (click)="reset()" type="button" class="btn btn-secondary me-2">{{isEditMode?'Cancel':'Reset'}}</button>
      <button type="submit" class="btn btn-primary">{{isEditMode?'Update':'Add'}}</button>
    </div>
  </form>
  </div>
  </div>
</div>
