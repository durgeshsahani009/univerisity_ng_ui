<div class="d-flex flex-column flex-root app-root">
  <div class="app-page flex-column flex-column-fluid">
<div class="app-header kt_app_header">
  <div class="kt_app_header_container d-flex align-items-stretch px-7">
    <div class="d-flex align-items-center d-lg-none ms-n3 me-1 me-md-2" title="Show sidebar menu">
      <div class="btn btn-icon btn-active-color-primary w-35px h-35px" id="kt_app_sidebar_mobile_toggle">
        <i class="ki-duotone ki-abstract-14 fs-2 fs-md-1">
          <span class="path1"></span>
          <span class="path2"></span>
        </i>
      </div>
    </div>

    <div class="d-flex align-items-center flex-grow-1 flex-lg-grow-0">
      <a href="" class="d-lg-none">IMS</a>
    </div>
        <div class="tabs_header_bar  flex-lg-grow-1">
          <h1>IMS</h1>
        </div>
    </div>
    </div>

<div class="container mt-10">
  <div class="row">
    <div class="col-md-6"><h3>Student List</h3></div>
    <div class="col-md-6 d-flex justify-content-end">
      <a class="btn btn-sm btn-primary" href="/add-student">Add Student</a>
    </div>
  </div>
  

  <table class="table table-sm">
    <thead>
    <tr>
      <th>Sr.No</th>
      <th>Name</th>
      <th>Age</th>
      <th>Program</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
    @for (item of studentList; let i=$index; track i) {
      <tr>
        <td>{{i+1}}</td>
        <td>{{item.name}}</td>
        <td>{{item.age}}</td>
        <td>{{item.program}}</td>
        <td>
          <button (click)="edit(item)" type="button" class="btn btn_sm btn-outline-primary me-2">
            <i class="fa fa-pencil" aria-hidden="true"></i>
          </button>
          <button (click)="delete(item)" type="button" class="btn btn_sm btn-outline-danger">
            <i class="fa fa-trash" aria-hidden="true"></i>
          </button>
        </td>
      </tr>
    }
    </tbody>
  </table>
  

</div>
</div>
</div>
